<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GLB Load Test — LaiMePet</title>
<style>
  body { margin: 0; background: #1a1a1a; font-family: sans-serif; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 16px; left: 16px;
    background: rgba(0,0,0,0.7); color: #fff;
    padding: 8px 16px; border-radius: 8px;
    font-size: 13px; font-family: monospace;
  }
  #info.success { border-left: 3px solid #4CAF50; }
  #info.error { border-left: 3px solid #E8553D; }
  #info.loading { border-left: 3px solid #F59E5B; }
</style>
</head>
<body>
<div id="info" class="loading">Loading GLB from /api/v1/model/...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const info = document.getElementById('info');

// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2522);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(1.5, 1.2, 2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domNode);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 5, 5);
dirLight.castShadow = true;
scene.add(dirLight);

// Grid helper
scene.add(new THREE.GridHelper(3, 20, 0x444444, 0x333333));

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1;

// Load GLB — try multiple paths
const urls = [
  'http://localhost:8000/api/v1/model/483241eb',
  'http://127.0.0.1:8000/api/v1/model/483241eb',
];

async function tryLoad(urls) {
  const loader = new GLTFLoader();
  for (const url of urls) {
    try {
      info.textContent = `Trying: ${url}...`;
      const gltf = await loader.loadAsync(url, (progress) => {
        const pct = Math.round((progress.loaded / progress.total) * 100);
        info.textContent = `Downloading... ${pct}%`;
      });

      scene.add(gltf.scene);

      // Center and scale
      const box = new THREE.Box3().setFromObject(gltf.scene);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2 / maxDim;
      gltf.scene.position.sub(center.multiplyScalar(scale));
      gltf.scene.scale.setScalar(scale);

      info.className = 'success';
      info.innerHTML = `✅ GLB Loaded!<br>
        Meshes: ${gltf.scene.children.length}<br>
        Animations: ${gltf.animations.length}<br>
        URL: ${url}<br>
        Size: ${maxDim.toFixed(2)} units`;

      return true;
    } catch (e) {
      info.textContent = `Failed: ${url} — ${e.message}`;
    }
  }

  info.className = 'error';
  info.innerHTML = `❌ Could not load GLB from any URL.<br>
    Make sure the FastAPI server is running:<br>
    <code>cd services && py main.py</code>`;
  return false;
}

// Also try loading from local blob if available
async function tryLoadLocal() {
  // List available pets from API
  try {
    const resp = await fetch('http://localhost:8000/api/v1/pets');
    const pets = await resp.json();
    if (pets.length > 0) {
      const petId = pets[pets.length - 1].pet_id;
      const modelUrl = `http://localhost:8000/api/v1/model/${petId}`;
      info.textContent = `Found pet: ${petId}, loading...`;
      return await tryLoad([modelUrl]);
    }
  } catch (e) {
    // Server not running
  }
  return await tryLoad(urls);
}

tryLoadLocal();

// Render loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
